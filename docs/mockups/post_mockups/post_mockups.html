<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規記事 - Blog CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Synthwave '84 カラーパレット */
            --bg-primary: #262335;
            --bg-secondary: #2a2139;
            --bg-tertiary: #34294f;
            --bg-hover: #3d3352;
            --text-primary: #c9c5bc;
            --text-secondary: #b8b8b8;
            --text-muted: #848bbd;
            --border-color: #34294f;
            --accent-primary: #ff7edb;
            --accent-hover: #ff99e5;
            --neon-pink: #ff7edb;
            --neon-cyan: #36f9f6;
            --neon-yellow: #fede5d;
            --neon-orange: #fe4450;
            --neon-purple: #b381c5;
            --neon-green: #72f1b8;
            --success: #72f1b8;
            --warning: #fede5d;
            --danger: #fe4450;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 0 30px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
        }

        .nav-tab {
            padding: 10px 20px;
            color: var(--neon-cyan);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 1.1rem;
            background: transparent;
            text-shadow: 0 0 6px var(--neon-cyan);
        }

        .nav-tab:hover:not(.active) {
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .nav-tab.active {
            background: transparent;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 10px rgba(54, 249, 246, 0.3);
            padding: 10px 20px;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: rgba(54, 249, 246, 0.1);
            box-shadow: 0 0 20px rgba(54, 249, 246, 0.5);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .btn-outline {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 10px rgba(54, 249, 246, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-outline:hover {
            background: rgba(54, 249, 246, 0.1);
            box-shadow: 0 0 20px rgba(54, 249, 246, 0.5);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .title-group {
            margin-bottom: 30px;
        }

        .title-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 3rem;
            color: var(--text-primary);
            font-weight: 700;
            outline: none;
            margin-bottom: 10px;
        }

        .title-input::placeholder {
            color: var(--text-muted);
        }

        /* Editor */
        .editor-container {
            border: 1px solid var(--neon-pink);
            border-radius: 8px;
            background: var(--bg-secondary);
            box-shadow: 0 0 10px rgba(255, 126, 219, 0.2);
        }

        .editor-textarea {
            width: 100%;
            background: transparent;
            border: none;
            padding: 20px;
            min-height: 500px;
            font-family: Menlo, Monaco, 'Courier New', monospace;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            resize: vertical;
            line-height: 1.7;
        }

        /* Editor Actions */
        .editor-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            margin-top: 20px;
        }

        .btn-save {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 10px rgba(54, 249, 246, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-save:hover {
            background: rgba(54, 249, 246, 0.1);
            box-shadow: 0 0 20px rgba(54, 249, 246, 0.5);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: var(--bg-secondary);
            overflow-y: auto;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--bg-tertiary);
            width: 270px;
        }

        .sidebar-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .status-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-option {
            padding: 15px;
            background: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-option:hover {
            border-color: var(--border-color);
        }

        .status-option.selected {
            border-color: var(--accent-primary);
            background: rgba(255, 126, 219, 0.15);
            box-shadow: 0 0 10px rgba(255, 126, 219, 0.3);
        }

        .status-text {
            flex: 1;
        }

        .status-text h4 {
            font-size: 0.9rem;
        }

        .form-field {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(255, 126, 219, 0.3);
            outline: none;
        }

        .media-preview {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-tertiary);
            border: 2px dashed var(--neon-cyan);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .media-preview:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(54, 249, 246, 0.3);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--neon-green);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--neon-green);
            box-shadow: 0 0 8px rgba(114, 241, 184, 0.3);
        }

        .tag-remove {
            cursor: pointer;
            color: var(--text-muted);
            font-weight: bold;
        }

        .tag-remove:hover {
            color: var(--danger);
        }

        .tag-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">CMS</div>
            <nav class="nav-tabs">
                <div class="nav-tab">記事一覧</div>
                <div class="nav-tab active">新規作成</div>
            </nav>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary">公開する</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Content Area -->
        <div class="content-area">
            <div class="content-wrapper">
                <!-- Title Section -->
                <div class="title-group">
                    <input type="text" class="title-input" placeholder="記事のタイトル">
                </div>

                <!-- Editor -->
                <div class="editor-container">
                    <textarea class="editor-textarea" placeholder="Markdownで本文を書く...

# 見出し

段落テキスト...

```javascript
const code = 'example';
```

- リスト項目"></textarea>
                </div>

                <!-- Editor Actions -->
                <div class="editor-actions">
                    <button class="btn btn-outline">プレビュー</button>
                    <button class="btn btn-save">下書き保存</button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 class="section-title">タグ</h3>
                <div class="tag-list">
                    <span class="tag-item">JavaScript <span class="tag-remove">×</span></span>
                    <span class="tag-item">Vue.js <span class="tag-remove">×</span></span>
                </div>
                <input type="text" class="tag-input" placeholder="タグを追加 (Enterで確定)">
            </div>

            <div class="sidebar-section">
                <h3 class="section-title">アイキャッチ画像</h3>
                <div class="media-preview">
                    <div style="color: var(--text-secondary); font-size: 0.9rem;">画像をアップロード</div>
                    <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 5px;">推奨: 1200×630px</div>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
